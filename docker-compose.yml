services:
  postgres:
    image: postgres:16-alpine
    container_name: sprintflow-postgres
    restart: always
    environment:
      POSTGRES_DB: sprintflow_db
      POSTGRES_USER: sprintflow_user
      POSTGRES_PASSWORD: sprintflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprintflow_user -d sprintflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
